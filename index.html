
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Content-Security-Policy (TD-006).

      Delivered as a <meta> tag because GitHub Pages cannot set HTTP headers.
      Two consequences worth knowing:
        - `frame-ancestors` is IGNORED in meta CSP, so this does NOT prevent
          clickjacking. That needs a host that can set headers (TD-019).
        - `report-uri` / `report-to` are also ignored, so violations appear in
          the browser console only.

      Scoped deliberately. `object-src`, `base-uri`, and `form-action` are the
      high-value, zero-breakage directives: the app uses no plugins, never
      rewrites its base URL, and posts no cross-origin forms, so locking those
      down closes real XSS-escalation paths for free.

      `connect-src` is intentionally permissive (`https:`), not tight. The Web
      Scraper tool fetches URLs the USER supplies, routed through public CORS
      proxies (TD-023), so there is no finite host list to enumerate — any
      tighter policy breaks that tool for some input and nobody finds out until
      a user reports it. `data:` and `blob:` are listed because the app builds
      images in memory; omitting them silently broke QR copy-to-clipboard, which
      e2e/clipboard.spec.ts caught.

      This directive gets tightened when TD-023 lands — replacing the public
      proxies with one controlled endpoint makes the host list finite. Until
      then `https:` at least blocks plaintext exfiltration and non-HTTP schemes.

      `unsafe-inline` on style-src is required: the app sets style={{…}}
      attributes throughout, and React renders those as inline style attributes.
      Removing it means refactoring every one of them.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' data: blob: https:; worker-src 'self' blob:; frame-src 'self' https://accounts.google.com https://docs.google.com; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>Sale Onboarding Team</title>
    <link rel="icon" type="image/png" href="/-Excel-helper/assets/favicon-BnC2831n.png" />
    <link rel="shortcut icon" type="image/png" href="/-Excel-helper/assets/favicon-BnC2831n.png" />
    <!-- Google Fonts: Inter for English, Cairo for Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Google Identity Services for Sheet Sync -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!--
      Tailwind is compiled at build time (tailwind.config.js + postcss.config.js,
      entry at index.css imported from index.tsx).

      It used to load from cdn.tailwindcss.com, which compiles CSS in the browser
      on every page load. That is explicitly not for production: it costs a
      render-blocking round trip plus in-browser compilation, makes the CDN a
      hard runtime dependency, and forces `unsafe-eval` into any CSP. See TD-007.
    -->
  <script type="module" crossorigin src="/-Excel-helper/assets/index-CYzBKWJZ.js"></script>
  <link rel="modulepreload" crossorigin href="/-Excel-helper/assets/vendor-react-C14am9Lm.js">
  <link rel="stylesheet" crossorigin href="/-Excel-helper/assets/index-BtMbmgmi.css">
</head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans transition-colors duration-300">
    <div id="root">
      <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #f8fafc; font-family: Inter, sans-serif; color: #64748b;">
        <svg style="animation: spin 1s linear infinite; height: 3rem; width: 3rem; color: #2563eb; margin-bottom: 1rem;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle style="opacity: 0.25;" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path style="opacity: 0.75;" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <p style="font-weight: 500; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;">Loading Workspace...</p>
        <style>
          @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
          @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        </style>
      </div>
    </div>
  </body>
</html>

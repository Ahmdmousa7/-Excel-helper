name: CI

# The seven pipeline stages, split across three jobs rather than one:
#
#   quality  1. Install  2. Lint  3. Type check  4. Unit tests  7. Build
#            8. Bundle budget
#   e2e      5. Playwright
#
# Stage 6 was the ApexYard review. The number is left vacant rather than
# renumbered so the stage names still line up with docs/APEXYARD.md and with
# the local runner's output — see "NOT IN CI, DELIBERATELY" below.
#
# They run in parallel because lint and type-check feedback should not wait
# behind a browser download. Running them in one sequential job would push
# first feedback from ~90s to ~5min for no gain — the stages have no ordering
# dependency on each other.
#
# HARD GATES (a failure here blocks the merge):
#   - TypeScript                    quality / type-check
#   - Unit tests                    quality / unit
#   - Build                         quality / build
#   - Bundle budget                 quality / bundle budget
#   - Playwright                    e2e
#
# SOFT (reported, does not block):
#   - ESLint warnings. Errors still fail; see eslint.config.js for the split.
#
# NOT IN CI, DELIBERATELY: the ApexYard/Claude review. There is no job for it
# at all — not even a green no-op. A job named after a gate, that passes
# without checking anything, is worse than its absence: it reads as coverage
# on the checks page. The statement lives in the aggregate job's summary
# instead, where it costs no runner and claims nothing.
#
# It runs on the maintainer's machine before any push, against the locally
# configured Claude CLI. No Anthropic key is stored in GitHub Secrets, in this
# file, or anywhere else off the local machine.
#
# The pre-push command is `npm run verify:local` — the full gate, which runs
# the review first and then everything else. `npm run review:local` is the
# review on its own, for iterating on findings; it is not the pre-push path.
#
# The reasoning is worth keeping: a key in Actions is a live credential inside
# a system that executes code from every pull request, reachable by any
# workflow change that lands. Moving the review to the maintainer's machine
# removes the credential from that blast radius entirely. The trade is real —
# CI can no longer *prove* the review happened — and it is the right trade,
# because the review is advisory judgment while the key is a standing secret.
#
# See docs/APEXYARD.md § "Why the AI review is local-only".

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['**']
  workflow_dispatch:

# A new push supersedes the previous run on the same ref. Never cancel on the
# default branch — those runs are the deploy record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  # =========================================================================
  # Stages 1-4 + 7
  # =========================================================================
  quality:
    name: Lint, type-check, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 1. Install
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: 2. Lint
        id: lint
        # Errors fail the step. Warnings are the documented known-debt tier and
        # are surfaced in the summary instead of blocking the merge.
        run: npm run lint

      - name: 3. Type check
        # HARD GATE. tsconfig.json already runs strict; a type error is a
        # defect, not a style preference.
        run: npm run typecheck

      - name: 4. Unit tests
        run: npm run test -- --coverage

      - name: 4b. Attestation end-to-end tests
        # The unit suite covers the serialisation and the gate arithmetic; this
        # drives both CLIs against real git repositories. It has to run in CI
        # rather than only locally, because the verifier it exercises is the
        # thing CI depends on — a break here would otherwise surface as a
        # confusing attestation failure on an unrelated PR.
        run: npm run test:attestation

      - name: 4c. Evidence bundle end-to-end tests
        # Same reasoning, for the bundle rules: generation, the shared
        # attestation id, reproducibility, and every failure mode the Evidence
        # bundle job gates on.
        run: npm run test:evidence

      - name: 7. Build
        run: npm run build

      - name: 8. Bundle budget
        # HARD GATE. Budgets live in bundle-budget.json and are ratchets set
        # just above today's measurement — the point is to notice growth, not
        # to permit it. Raising one requires a stated reason in the diff.
        run: node scripts/check-bundle-budget.mjs

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # =========================================================================
  # Stage 5
  # =========================================================================
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Resolve the Playwright version
        id: pw
        # Key the cache on the exact installed version. Keying on the
        # package.json range would serve a stale browser after a patch bump,
        # and Playwright hard-fails on a browser/driver mismatch.
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore cached browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install OS dependencies only
        # The cache holds the browser binaries but not the apt packages they
        # link against, so those are installed on every run regardless.
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: 5. Playwright
        # HARD GATE. playwright.config.ts builds and serves the built bundle, so
        # this exercises the real production output rather than the dev server.
        # (It used to build with VITE_E2E_AUTH_BYPASS; ADR-0005 removed the
        # sign-in gate, so there is nothing left to bypass.)
        run: npm run e2e
        env:
          CI: 'true'

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # =========================================================================
  # Stage 6 — verify the LOCAL review's attestation. Runs no model.
  # =========================================================================
  # This is the closest CI can get to enforcing a local review. It does not
  # prove a model was invoked — nothing running here can, since the attestation
  # is produced by the same machine that would fake it. What it does prove is
  # that a review was recorded covering *exactly this code*: every file it
  # claims to have reviewed still has the git blob OID it recorded, and nothing
  # changed in this range that the attestation does not cover.
  #
  # That closes the failure that actually happens — reviewing, then amending,
  # rebasing, or adding one more file, and pushing a review that no longer
  # describes the code. See docs/adr/ADR-0002.
  attestation:
    name: Evidence bundle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The coverage check diffs base..head, so both ends must be present.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve the range this push or PR represents
        id: range
        run: |
          # A PR compares against its merge base. A push compares against the
          # commit that was there before. `github.event.before` is all-zeroes
          # on a branch's first push, in which case there is no meaningful
          # base and the verifier falls back to content binding alone.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base='${{ github.event.before }}'
          fi
          case "$base" in
            ''|0000000000000000000000000000000000000000)
              echo 'base=' >> "$GITHUB_OUTPUT"
              echo '::notice title=Review attestation::No comparable base for this event; verifying content binding only.'
              ;;
            *)
              if git cat-file -e "${base}^{commit}" 2>/dev/null; then
                echo "base=$base" >> "$GITHUB_OUTPUT"
              else
                echo 'base=' >> "$GITHUB_OUTPUT"
                echo "::notice title=Review attestation::Base $base is not in this checkout; verifying content binding only."
              fi
              ;;
          esac

      - name: 6. Verify the evidence bundle
        # HARD GATE, and a superset of the step above: artifacts exist, the
        # attestation's id is the digest of its own content (so a hand-edited
        # field fails), every artifact carries THAT id (so a stale one fails),
        # and no artifact contains timestamp-shaped content or non-canonical
        # formatting.
        #
        # Deliberately NOT `evidence.mjs --check` here. Regenerating in CI would
        # need the raw tool output the local gate captured, which is gitignored;
        # the reproduce-byte-for-byte proof runs locally, where those inputs
        # exist. CI checks the committed bundle's integrity and binding instead.
        run: |
          node scripts/verify-evidence.mjs \
            --require-gate high \
            ${{ steps.range.outputs.base && format('--base {0}', steps.range.outputs.base) || '' }}

  # =========================================================================
  # Single required check, so branch protection needs one entry, not three.
  # =========================================================================
  ci:
    name: CI
    if: always()
    needs: [quality, e2e, attestation]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate the gate results
        run: |
          quality='${{ needs.quality.result }}'
          e2e='${{ needs.e2e.result }}'
          attestation='${{ needs.attestation.result }}'

          {
            echo '## CI gates'
            echo ''
            echo '| Gate | Result |'
            echo '|---|---|'
            echo "| Lint, type-check, unit + coverage, build, bundle budget | \`$quality\` |"
            echo "| Playwright | \`$e2e\` |"
            echo "| Review attestation | \`$attestation\` |"
            echo ''
            echo '### The AI review itself runs locally, before the push.'
            echo ''
            echo 'ApexYard'"'"'s Claude-backed review runs on the maintainer'"'"'s'
            echo 'machine via `npm run verify:local`. It does not run here, and'
            echo 'no Anthropic credential exists in this repository'"'"'s secrets,'
            echo 'workflows, or images — by policy (ADR-0001).'
            echo ''
            echo 'What CI *can* check is the **attestation** that review leaves'
            echo 'behind: every file it recorded still has the exact git blob it'
            echo 'reviewed, and nothing changed in this range that it does not'
            echo 'cover. That catches a review going stale — the failure that'
            echo 'actually happens. It does **not** prove a model was invoked,'
            echo 'because the machine that writes the attestation is the same'
            echo 'one that could fake it. See ADR-0002 for the threat model and'
            echo 'TD-027 for the residual gap.'
          } >> "$GITHUB_STEP_SUMMARY"

          # `skipped` is NOT a pass. All three jobs are unconditional, so a skip
          # means something upstream went wrong — a cancelled run, a bad
          # `if:` added later — and treating it as success would make the
          # required check green for a pipeline that never ran.
          failed=0
          for r in "$quality" "$e2e" "$attestation"; do
            case "$r" in
              success) ;;
              *) failed=1 ;;
            esac
          done

          if [ "$failed" -eq 1 ]; then
            echo '::error title=CI::One or more required gates failed.'
            exit 1
          fi
          echo 'All gates passed.'

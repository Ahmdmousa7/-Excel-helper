name: CI

# The seven pipeline stages, split across three jobs rather than one:
#
#   quality  1. Install  2. Lint  3. Type check  4. Unit tests  7. Build
#            8. Bundle budget
#   e2e      5. Playwright
#
# Stage 6 was the ApexYard review. The number is left vacant rather than
# renumbered so the stage names still line up with docs/APEXYARD.md and with
# the local runner's output — see "NOT IN CI, DELIBERATELY" below.
#
# They run in parallel because lint and type-check feedback should not wait
# behind a browser download. Running them in one sequential job would push
# first feedback from ~90s to ~5min for no gain — the stages have no ordering
# dependency on each other.
#
# HARD GATES (a failure here blocks the merge):
#   - TypeScript                    quality / type-check
#   - Unit tests                    quality / unit
#   - Build                         quality / build
#   - Bundle budget                 quality / bundle budget
#   - Playwright                    e2e
#
# SOFT (reported, does not block):
#   - ESLint warnings. Errors still fail; see eslint.config.js for the split.
#
# NOT IN CI, DELIBERATELY: the ApexYard/Claude review. There is no job for it
# at all — not even a green no-op. A job named after a gate, that passes
# without checking anything, is worse than its absence: it reads as coverage
# on the checks page. The statement lives in the aggregate job's summary
# instead, where it costs no runner and claims nothing.
#
# It runs on the maintainer's machine before any push, against the locally
# configured Claude CLI. No Anthropic key is stored in GitHub Secrets, in this
# file, or anywhere else off the local machine.
#
# The pre-push command is `npm run verify:local` — the full gate, which runs
# the review first and then everything else. `npm run review:local` is the
# review on its own, for iterating on findings; it is not the pre-push path.
#
# The reasoning is worth keeping: a key in Actions is a live credential inside
# a system that executes code from every pull request, reachable by any
# workflow change that lands. Moving the review to the maintainer's machine
# removes the credential from that blast radius entirely. The trade is real —
# CI can no longer *prove* the review happened — and it is the right trade,
# because the review is advisory judgment while the key is a standing secret.
#
# See docs/APEXYARD.md § "Why the AI review is local-only".

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['**']
  workflow_dispatch:

# A new push supersedes the previous run on the same ref. Never cancel on the
# default branch — those runs are the deploy record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  # =========================================================================
  # Stages 1-4 + 7
  # =========================================================================
  quality:
    name: Lint, type-check, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 1. Install
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: 2. Lint
        id: lint
        # Errors fail the step. Warnings are the documented known-debt tier and
        # are surfaced in the summary instead of blocking the merge.
        run: npm run lint

      - name: 3. Type check
        # HARD GATE. tsconfig.json already runs strict; a type error is a
        # defect, not a style preference.
        run: npm run typecheck

      - name: 4. Unit tests
        run: npm run test -- --coverage

      - name: 7. Build
        run: npm run build

      - name: 8. Bundle budget
        # HARD GATE. Budgets live in bundle-budget.json and are ratchets set
        # just above today's measurement — the point is to notice growth, not
        # to permit it. Raising one requires a stated reason in the diff.
        run: node scripts/check-bundle-budget.mjs

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # =========================================================================
  # Stage 5
  # =========================================================================
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Resolve the Playwright version
        id: pw
        # Key the cache on the exact installed version. Keying on the
        # package.json range would serve a stale browser after a patch bump,
        # and Playwright hard-fails on a browser/driver mismatch.
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore cached browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install OS dependencies only
        # The cache holds the browser binaries but not the apt packages they
        # link against, so those are installed on every run regardless.
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: 5. Playwright
        # HARD GATE. playwright.config.ts builds with VITE_E2E_AUTH_BYPASS and
        # serves the built bundle, so this exercises the real production output
        # rather than the dev server.
        run: npm run e2e
        env:
          CI: 'true'

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # =========================================================================
  # Single required check, so branch protection needs one entry, not two.
  # =========================================================================
  ci:
    name: CI
    if: always()
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate the gate results
        run: |
          quality='${{ needs.quality.result }}'
          e2e='${{ needs.e2e.result }}'

          {
            echo '## CI gates'
            echo ''
            echo '| Gate | Result |'
            echo '|---|---|'
            echo "| Lint, type-check, unit + coverage, build, bundle budget | \`$quality\` |"
            echo "| Playwright | \`$e2e\` |"
            echo ''
            echo '### AI review is intentionally executed locally before push.'
            echo ''
            echo 'ApexYard'"'"'s Claude-backed review runs on the maintainer'"'"'s'
            echo 'machine via `npm run verify:local`, before anything is pushed.'
            echo 'It does not run here and no Anthropic credential exists in'
            echo 'this repository'"'"'s secrets, workflows, or images — by policy.'
            echo ''
            echo 'There is deliberately **no CI job** for it. An always-green'
            echo 'job would look like a gate while checking nothing, which is'
            echo 'worse than an honest absence. Nothing in this pipeline'
            echo 'verifies the local review happened; that gap is tracked as'
            echo 'TD-027 and explained in ADR-0001.'
          } >> "$GITHUB_STEP_SUMMARY"

          # `skipped` is NOT a pass. Both jobs are unconditional, so a skip
          # means something upstream went wrong — a cancelled run, a bad
          # `if:` added later — and treating it as success would make the
          # required check green for a pipeline that never ran.
          failed=0
          for r in "$quality" "$e2e"; do
            case "$r" in
              success) ;;
              *) failed=1 ;;
            esac
          done

          if [ "$failed" -eq 1 ]; then
            echo '::error title=CI::One or more required gates failed.'
            exit 1
          fi
          echo 'All gates passed.'
